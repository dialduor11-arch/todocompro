<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Compro</title>
<style>
  :root{
    --gold:#D4A23F;
    --gold-dark:#C68021;
    --gold-darker:#a86c1c;
    --dark:#151616;
    --dark-2:#1f2020;
    --cream:#FDF9F2;
    --text:#1c1d1e;
    --muted:#767268;
    --border:#e8e3d6;
    --green:#3a9d5d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:#fff;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ul{list-style:none;margin:0;padding:0;}
  img{max-width:100%;display:block;}
  svg{width:18px;height:18px;vertical-align:middle;flex-shrink:0;stroke:currentColor;fill:none;}

  /* ---------- Topbar ---------- */
  .topbar{
    background:var(--cream);
    border-bottom:1px solid var(--border);
    font-size:13px;
    color:#54504a;
  }
  .topbar-inner{
    max-width:1400px;margin:0 auto;
    display:flex;justify-content:space-between;
    padding:9px 32px;
    gap:16px;
  }
  .topbar-inner span{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .topbar-inner svg{width:15px;height:15px;flex:none;}

  /* ---------- Header ---------- */
  header.main{
    background:#fff;
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1400px;margin:0 auto;
    display:flex;align-items:center;gap:28px;
    padding:16px 32px;
  }
  .logo-link{display:flex;align-items:center;flex:none;}
  .logo-link img{height:42px;width:auto;}
  .search-wrap{
    flex:1;display:flex;max-width:640px;
  }
  .search-wrap input{
    flex:1;border:1px solid #ddd;border-right:none;
    border-radius:8px 0 0 8px;
    padding:11px 16px;font-size:14px;outline:none;background:#fafafa;
  }
  .search-wrap input:focus{border-color:var(--gold);background:#fff;}
  .search-btn{
    background:var(--gold);border:none;border-radius:0 8px 8px 0;
    width:50px;display:flex;align-items:center;justify-content:center;
  }
  .search-btn svg{width:19px;height:19px;stroke:#fff;}
  .header-actions{display:flex;align-items:center;gap:26px;margin-left:auto;flex:none;}
  .header-action{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:#333;position:relative;}
  .header-action svg{width:22px;height:22px;stroke:#222;fill:none;}
  .cart-count{
    position:absolute;top:-8px;right:-10px;
    background:var(--gold);color:#fff;font-size:10.5px;font-weight:700;
    border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Category nav ---------- */
  .catnav{
    max-width:1400px;margin:0 auto;width:100%;
    display:flex;align-items:center;gap:30px;
    padding:13px 32px;font-size:14.5px;font-weight:500;color:#2c2c2c;
    overflow-x:auto;
  }
  .catnav .catall{
    display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;
  }
  .catnav a{display:flex;align-items:center;gap:7px;white-space:nowrap;color:#333;}
  .catnav a.active{color:var(--gold-dark);}
  .catnav svg{width:16px;height:16px;stroke:currentColor;fill:none;flex:none;}

  /* ---------- Layout wrapper ---------- */
  .page{max-width:1400px;margin:0 auto;padding:40px 32px 60px;min-height:62vh;display:flex;flex-direction:column;justify-content:center;}

  /* ---------- Footer strip ---------- */
  .trustfoot{
    background:var(--cream);border-top:1px solid var(--border);
    margin-top:40px;
  }
  .trustfoot-inner{
    max-width:1400px;margin:0 auto;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;
    padding:26px 32px;
  }
  .trustfoot-item{display:flex;align-items:center;gap:12px;font-size:13.5px;}
  .trustfoot-item svg{width:26px;height:26px;stroke:var(--gold-dark);fill:none;flex:none;}
  .trustfoot-item b{display:block;font-size:13.5px;color:#222;}
  .trustfoot-item span{color:var(--muted);font-size:12.5px;}

  .sitefoot{
    background:var(--dark);color:#cfcac0;font-size:12.5px;
    padding:16px 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 0;
  }
  .sitefoot a{color:#cfcac0;margin-left:18px;white-space:nowrap;}

  /* generic small star row */
  .stars{color:var(--gold);font-size:13px;letter-spacing:1px;}
  .stars .cnt{color:var(--muted);font-size:12px;margin-left:4px;letter-spacing:0;}

  /* button styles */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:8px;font-weight:700;font-size:14.5px;
    border:1px solid transparent;transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(0.95);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-outline{background:#fff;color:var(--gold-dark);border-color:var(--gold);}
  .btn-dark{background:var(--dark);color:#fff;}
  .btn-block{width:100%;}

  /* toast */
  .toast{
    position:fixed;top:18px;right:18px;background:#1f8a4c;color:#fff;
    padding:14px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);
    z-index:999;opacity:0;transform:translateY(-10px);transition:all .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  /* Image zoom lightbox */
  .zoom-overlay{
    position:fixed;inset:0;z-index:960;background:rgba(15,14,12,.88);
    display:flex;align-items:center;justify-content:center;padding:40px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;cursor:zoom-out;
  }
  .zoom-overlay.show{opacity:1;pointer-events:auto;}
  .zoom-overlay img{
    max-width:min(88vw,720px);max-height:86vh;object-fit:contain;
    border-radius:10px;background:#fff;cursor:default;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .zoom-close{
    position:absolute;top:22px;right:28px;width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;
    font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .zoom-close:hover{background:rgba(255,255,255,.25);}

  /* Product image magnifier (estilo Mercado Libre) */
  .zoom-lens{
    position:absolute;border:2px solid var(--gold);background:rgba(212,162,63,.18);
    pointer-events:none;display:none;width:150px;height:150px;
  }
  .zoom-pane{
    position:absolute;top:0;left:calc(100% + 20px);width:440px;height:100%;
    border:1px solid var(--border);border-radius:12px;background-color:#fafafa;
    background-repeat:no-repeat;display:none;z-index:60;
    box-shadow:0 14px 34px rgba(0,0,0,.16);
  }
  @media (max-width:1100px){
    .zoom-pane{display:none !important;}
    .zoom-lens{display:none !important;}
  }

  /* WhatsApp floating button */
  .whatsapp-fab{
    position:fixed;right:22px;bottom:22px;z-index:850;
    width:60px;height:60px;border-radius:50%;
    background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .whatsapp-fab img{display:block;}
  .whatsapp-fab:hover{transform:scale(1.07);box-shadow:0 8px 22px rgba(0,0,0,.3);}
  @media (max-width:600px){
    .whatsapp-fab{right:16px;bottom:16px;width:54px;height:54px;}
    .whatsapp-fab img{width:34px;height:auto;}
  }

  /* cart drawer */
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(20,18,14,.35);z-index:900;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .drawer-overlay.show{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;
    background:#fff;z-index:901;box-shadow:-10px 0 30px rgba(0,0,0,.15);
    transform:translateX(100%);transition:transform .3s ease;
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--border);}
  .drawer-head h3{margin:0;font-size:20px;}
  .drawer-body{padding:20px 24px;overflow-y:auto;flex:1;}
  .drawer-foot{padding:20px 24px;border-top:1px solid var(--border);}

  /* flex-based grid replacement (n equal columns, wraps, gap via margin for old engines) */
  .flexgrid{
    display:flex;flex-wrap:wrap;gap:16px;
  }
  .flexgrid > *{
    flex:0 1 calc((100% / var(--n)) - 16px);
    max-width:calc((100% / var(--n)) - 16px);
    min-width:160px;
  }
  .cart-row{
    display:flex;align-items:center;gap:12px;
  }
  .cart-row > *:nth-child(1){flex:2 1 0;min-width:0;}
  .cart-row > *:nth-child(2){flex:1 1 0;}
  .cart-row > *:nth-child(3){flex:1 1 0;}
  .cart-row > *:nth-child(4){flex:1 1 0;}
  .cart-row > *:nth-child(5){flex:0 0 auto;}

  @media (max-width:900px){
    .flexgrid > *{flex:1 1 100%;max-width:100%;}
    .cart-row{flex-wrap:wrap;}
    .header-inner{flex-wrap:wrap;}
    .search-wrap{order:3;max-width:100%;flex:1 1 100%;}
    .catnav{gap:16px;}
    .page{padding:24px 16px 40px;min-height:0;}
    .home-layout,.product-detail,.cart-layout,.category-layout,.checkout-layout{flex-direction:column;}
    .home-sidebar,.product-thumbs-col,.cart-summary,.category-filters{flex:1 1 auto !important;width:100%;}
    .checkout-layout{flex-direction:column !important;}
    .checkout-layout > *{flex:1 1 auto !important;width:100% !important;max-width:100% !important;}
    .category-layout > *{flex:1 1 auto !important;width:100% !important;max-width:100% !important;height:auto !important;}
  }

  @media (max-width:640px){
    /* Topbar: se apila y centra en vez de amontonarse en una linea */
    .topbar-inner{flex-wrap:wrap;justify-content:center;text-align:center;gap:6px 18px;padding:8px 16px;}

    /* Header: logo + accesos en una fila mas compacta, buscador abajo a lo ancho */
    .header-inner{padding:12px 16px;gap:10px;}
    .logo-link img{height:34px;}
    .header-actions{gap:16px;}
    .header-action span{font-size:11px;}
    .header-action svg{width:19px;height:19px;}

    /* Categorias: scroll horizontal mas prolijo, sin scrollbar visible */
    .catnav{padding:10px 16px;gap:18px;-ms-overflow-style:none;scrollbar-width:none;}
    .catnav::-webkit-scrollbar{display:none;}
    .catnav-more{display:none;}

    /* Sidebar de categorias: se oculta en el home/categoria en mobile,
       ya existe acceso por la barra de categorias y las tarjetas rapidas */
    .home-sidebar{display:none;}

    /* Banner principal: texto arriba, imagen abajo, en vez de apretarse en columnas */
    .hero-banner{flex-direction:column !important;border-radius:12px;}
    .hero-copy{padding:26px 22px !important;flex:none !important;}
    .hero-copy h1{font-size:26px;}
    .hero-copy p{max-width:none !important;}
    .hero-media{flex:none !important;height:200px;}
    .hero-mini-perks{gap:16px !important;}

    /* Categorias rapidas: 3 por fila en vez de una gigante apilada */
    .quick-cats > *{flex:1 1 calc(33.333% - 11px) !important;max-width:calc(33.333% - 11px) !important;min-width:0 !important;padding:12px 4px !important;}
    .quick-cats > * span{width:20px;height:20px;}

    /* Grillas de producto: 2 columnas en vez de 1 sola gigante */
    .flexgrid > *{flex:1 1 calc(50% - 8px) !important;max-width:calc(50% - 8px) !important;min-width:0 !important;}
    .flexgrid{gap:10px;}
    .quick-cats > *{flex:1 1 calc(33.333% - 11px) !important;max-width:calc(33.333% - 11px) !important;}
    .prod-card-body{padding:10px 10px 12px;}
    .prod-name{font-size:12.5px;}
    .prod-price b{font-size:14px;}

    /* Excepciones que si deben quedar en una sola columna en mobile */
    .checkout-layout .flexgrid > *,
    #reviews-section .flexgrid > *,
    .contact-form .flexgrid > *{
      flex:1 1 100% !important;max-width:100% !important;
    }

    /* Carrito: la fila de producto pasa a apilarse mejor */
    .cart-row > *{flex:1 1 100% !important;}
    .cart-row-product{flex:1 1 100% !important;}
    .cart-table-head{display:none;}

    /* Producto: imagen principal primero, miniaturas en fila horizontal debajo */
    .product-detail{flex-direction:column-reverse;}
    .product-thumbs-col{flex-direction:row !important;overflow-x:auto;flex:none !important;}
    .product-thumbs-col > div{flex:0 0 64px;width:64px;height:64px;}
    .product-thumbs-col img{width:100%;height:100%;object-fit:cover;}

    /* Paneles de administracion: permitir scroll horizontal en tablas anchas */
    .page{padding:20px 14px 32px;}

    /* Pasos del checkout: mas compactos para que entren los 4 sin cortarse */
    .checkout-steps{justify-content:flex-start !important;}
    .checkout-step-line{width:28px !important;}

    /* Tablas de los paneles de admin: scroll horizontal propio en vez de aplastarse */
    .admin-table{overflow-x:auto !important;}
    .admin-table .admin-row{min-width:640px;}
  }
</style>
</head>

/* ============ Banner del home (imagenes editables, persistidas) ============ */
const BANNER_KEY = 'todocompro_banner_v1';
let bannerCache = null;
function getBannerImages(){
  if(bannerCache) return bannerCache;
  try{
    const raw = localStorage.getItem(BANNER_KEY);
    bannerCache = raw ? JSON.parse(raw) : null;
  }catch(e){
    bannerCache = null;
  }
  if(!bannerCache || !bannerCache.length) bannerCache = [ASSETS.hero_banner];
  return bannerCache;
}
function persistBannerImages(){
  try{ localStorage.setItem(BANNER_KEY, JSON.stringify(bannerCache)); }
  catch(e){ /* solo en memoria durante esta sesion si falla */ }
}
function addBannerImage(dataUri){
  const imgs = getBannerImages();
  imgs.push(dataUri);
  persistBannerImages();
  heroUi.index = imgs.length - 1;
}
function removeBannerImage(idx){
  const imgs = getBannerImages();
  if(imgs.length <= 1){ showToast('Debe quedar al menos una imagen'); return; }
  imgs.splice(idx, 1);
  persistBannerImages();
  if(heroUi.index >= imgs.length) heroUi.index = imgs.length - 1;
}
const heroUi = { index: 0 };
function heroNext(){ const imgs = getBannerImages(); heroUi.index = (heroUi.index + 1) % imgs.length; render(); }
function heroPrev(){ const imgs = getBannerImages(); heroUi.index = (heroUi.index - 1 + imgs.length) % imgs.length; render(); }

/* ============ Catálogo editable (agregar / editar productos) ============
   BASE_PRODUCTS es el catálogo original (no se modifica).
   PRODUCTS es la lista "en vivo" que usa todo el sitio: BASE_PRODUCTS con
   las ediciones del admin aplicadas + los productos nuevos que haya creado.
   Todo se guarda en localStorage para persistir entre visitas. ============ */
const PRODUCTS_KEY = 'todocompro_products_v1';
let productOverridesCache = null;
function loadProductOverrides(){
  if(productOverridesCache) return productOverridesCache;
  try{
    const raw = localStorage.getItem(PRODUCTS_KEY);
    productOverridesCache = raw ? JSON.parse(raw) : null;
  }catch(e){
    productOverridesCache = null;
  }
  if(!productOverridesCache) productOverridesCache = {edits:{}, added:[]};
  if(!productOverridesCache.edits) productOverridesCache.edits = {};
  if(!productOverridesCache.added) productOverridesCache.added = [];
  return productOverridesCache;
}
function persistProductOverrides(){
  try{ localStorage.setItem(PRODUCTS_KEY, JSON.stringify(productOverridesCache)); }
  catch(e){ /* solo en memoria durante esta sesion si falla */ }
}
let PRODUCTS = [];
function rebuildProducts(){
  const overrides = loadProductOverrides();
  const applyEdit = p => overrides.edits[p.id] ? Object.assign({}, p, overrides.edits[p.id]) : p;
  const merged = BASE_PRODUCTS.map(applyEdit);
  const added = overrides.added.map(applyEdit);
  PRODUCTS = merged.concat(added);
}
rebuildProducts();

function slugify(str){
  return (str||'producto').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'producto';
}
function genPlaceholderIcon(name){
  const letter = ((name||'?').trim()[0] || '?').toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#EFECE6"/><text x="200" y="245" font-size="170" font-family="Arial" text-anchor="middle" fill="#151616">${letter}</text></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function byId(id){ return PRODUCTS.find(p=>p.id===id); }
function categoryLabel(key){ const c = CATEGORIES.find(x=>x.key===key); return c ? c.label : key; }
function escapeHtml(str){
  return (str||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function money(n){
  const s = Math.round(n).toString();
  const withDots = s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return '$' + withDots;
}
function starRow(rating){
  const full = Math.round(rating);
  let s='';
  for(let i=0;i<5;i++){ s += i<full ? '★' : '☆'; }
  return s;
}

const state = {
  view: 'home',           // home | product | cart | checkout | favorites | account
  productId: 'mini_aspiradora_3en1',
  categoryKey: 'tecnologia',
  cart: [],                // {id, qty, color}
  checkoutStep: 1,         // 1 cart,2 info,3 shipping-redirect,4 payment
  contact: {},
  address: {},
  shipping: 'standard',
  payment: 'mercadopago',
  favorites: [],           // array of product ids
  user: null,              // {name, email} once "logged in" (mock, en memoria)
  policyKey: 'terminos',
  searchQuery: '',
};

function cartCount(){ return state.cart.reduce((a,c)=>a+c.qty,0); }
function favoritesCount(){ return state.favorites.length; }
function isFavorite(id){ return state.favorites.includes(id); }
function toggleFavorite(id, ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const idx = state.favorites.indexOf(id);
  if(idx>-1){ state.favorites.splice(idx,1); showToast('Se quitó de favoritos'); }
  else { state.favorites.push(id); showToast('¡Agregado a favoritos!'); }
  render();
}
function cartTotal(){ return state.cart.reduce((a,c)=>a + byId(c.id).price*c.qty, 0); }

function addToCart(id, qty, color){
  const existing = state.cart.find(c=>c.id===id && c.color===color);
  if(existing){ existing.qty += qty; }
  else{ state.cart.push({id, qty, color}); }
  openDrawer(id);
  updateHeaderCounts();
}
function removeFromCart(idx){
  state.cart.splice(idx,1);
  render();
}
function changeQty(idx, delta){
  state.cart[idx].qty = Math.max(1, state.cart[idx].qty + delta);
  render();
}

function go(view, opts, fromHistory){
  state.view = view;
  if(opts && opts.productId) state.productId = opts.productId;
  if(opts && opts.step) state.checkoutStep = opts.step;
  if(opts && opts.categoryKey) state.categoryKey = opts.categoryKey;
  if(opts && opts.policyKey) state.policyKey = opts.policyKey;
  if(opts && opts.searchQuery !== undefined) state.searchQuery = opts.searchQuery;
  window.scrollTo({top:0, behavior:'instant'});
  if(!fromHistory) pushHistory();
  render();
}

/* ============ Browser back/forward support ============ */
function stateToHash(){
  if(state.view==='product') return '#product/' + state.productId;
  if(state.view==='category') return '#category/' + state.categoryKey;
  if(state.view==='cart') return '#cart';
  if(state.view==='checkout') return '#checkout/' + state.checkoutStep;
  if(state.view==='favorites') return '#favorites';
  if(state.view==='account') return '#account';
  if(state.view==='policy') return '#policy/' + state.policyKey;
  if(state.view==='inventory') return '#inventario';
  if(state.view==='orders') return '#pedidos-admin';
  if(state.view==='salesDashboard') return '#panel-ventas';
  if(state.view==='bannerPanel') return '#panel-banner';
  if(state.view==='productForm') return productFormUi.editingId ? '#inventario/editar/' + productFormUi.editingId : '#inventario/nuevo';
  if(state.view==='search') return '#search/' + encodeURIComponent(state.searchQuery||'');
  return '#home';
}
function pushHistory(){
  const hash = stateToHash();
  const snapshot = {view:state.view, productId:state.productId, categoryKey:state.categoryKey, checkoutStep:state.checkoutStep, policyKey:state.policyKey, searchQuery:state.searchQuery};
  try{
    if(window.location.hash !== hash){
      history.pushState(snapshot, '', hash);
    } else {
      history.replaceState(snapshot, '', hash);
    }
  }catch(e){
    /* history.pushState puede fallar si el archivo se abre directo desde
       el disco (file://) en vez de servido por un dominio (http/https).
       En ese caso seguimos navegando normalmente, solo sin atrás/adelante. */
  }
}
function applyHash(){
  const hash = window.location.hash || '#home';
  const parts = hash.replace('#','').split('/');
  const route = parts[0], param = parts[1];
  if(route==='product' && param) go('product', {productId:param}, true);
  else if(route==='category' && param) go('category', {categoryKey:param}, true);
  else if(route==='cart') go('cart', null, true);
  else if(route==='checkout') go('checkout', {step: parseInt(param||'2',10)}, true);
  else if(route==='favorites') go('favorites', null, true);
  else if(route==='account') go('account', null, true);
  else if(route==='policy') go('policy', {policyKey:param||'terminos'}, true);
  else if(route==='inventario' && param==='nuevo'){ productFormUi.editingId=null; productFormUi.imgData=null; go('productForm', null, true); }
  else if(route==='inventario' && param==='editar' && parts[2]){ productFormUi.editingId=parts[2]; const pp=byId(parts[2]); productFormUi.imgData = pp?pp.img:null; go('productForm', null, true); }
  else if(route==='inventario') go('inventory', null, true);
  else if(route==='pedidos-admin') go('orders', null, true);
  else if(route==='panel-ventas') go('salesDashboard', null, true);
  else if(route==='panel-banner') go('bannerPanel', null, true);
  else if(route==='search') go('search', {searchQuery: decodeURIComponent(param||'')}, true);
  else go('home', null, true);
}
window.addEventListener('popstate', (e)=>{
  if(e.state){
    state.view = e.state.view;
    state.productId = e.state.productId;
    state.categoryKey = e.state.categoryKey;
    state.checkoutStep = e.state.checkoutStep;
    state.policyKey = e.state.policyKey;
    state.searchQuery = e.state.searchQuery;
    window.scrollTo({top:0, behavior:'instant'});
    render();
  } else {
    applyHash();
  }
});

/* ============ Product image magnifier (estilo Mercado Libre) ============ */
function showZoomPane(src){
  const pane = document.getElementById('js-zoom-pane');
  const lens = document.getElementById('js-zoom-lens');
  const hint = document.getElementById('js-zoom-hint');
  if(!pane || !lens) return;
  if(window.innerWidth <= 1100) return; /* desactivado en pantallas chicas */
  pane.style.backgroundImage = `url('${src}')`;
  pane.style.display = 'block';
  lens.style.display = 'block';
  if(hint) hint.style.display = 'none';
}
function hideZoomPane(){
  const pane = document.getElementById('js-zoom-pane');
  const lens = document.getElementById('js-zoom-lens');
  const hint = document.getElementById('js-zoom-hint');
  if(pane) pane.style.display = 'none';
  if(lens) lens.style.display = 'none';
  if(hint) hint.style.display = 'flex';
}
function handleZoomMove(ev){
  const container = document.getElementById('js-zoom-container');
  const lens = document.getElementById('js-zoom-lens');
  const pane = document.getElementById('js-zoom-pane');
  if(!container || !lens || !pane || window.innerWidth <= 1100) return;

  const rect = container.getBoundingClientRect();
  const lensSize = lens.offsetWidth;
  let x = ev.clientX - rect.left;
  let y = ev.clientY - rect.top;

  let lensX = Math.min(Math.max(x - lensSize/2, 0), rect.width - lensSize);
  let lensY = Math.min(Math.max(y - lensSize/2, 0), rect.height - lensSize);
  lens.style.left = lensX + 'px';
  lens.style.top = lensY + 'px';

  const ratioX = pane.offsetWidth / lensSize;
  const ratioY = pane.offsetHeight / lensSize;
  pane.style.backgroundSize = (rect.width * ratioX) + 'px ' + (rect.height * ratioY) + 'px';
  pane.style.backgroundPosition = (-lensX * ratioX) + 'px ' + (-lensY * ratioY) + 'px';
}

function normalizeText(str){
  return (str||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function searchProducts(query){
  const q = normalizeText(query);
  if(!q) return [];
  return PRODUCTS.filter(p=>{
    const haystack = normalizeText(p.name + ' ' + p.short + ' ' + p.desc + ' ' + categoryLabel(p.category));
    return haystack.includes(q);
  });
}

const productFormUi = { editingId: null, imgData: null };

function openNewProductForm(){
  productFormUi.editingId = null;
  productFormUi.imgData = null;
  go('productForm');
}
function openEditProductForm(id){
  const p = byId(id);
  if(!p) return;
  productFormUi.editingId = id;
  productFormUi.imgData = p.img;
  go('productForm');
}
function handleProductImageUpload(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    productFormUi.imgData = e.target.result;
    render();
  };
  reader.readAsDataURL(file);
}
function saveProductForm(){
  const name = (document.getElementById('pf_name').value || '').trim();
  const category = document.getElementById('pf_category').value;
  const price = parseInt(document.getElementById('pf_price').value, 10);
  const short = (document.getElementById('pf_short').value || '').trim();
  const desc = (document.getElementById('pf_desc').value || '').trim();
  const colorsRaw = (document.getElementById('pf_colors').value || '').trim();
  const stock = Math.max(0, parseInt(document.getElementById('pf_stock').value, 10) || 0);
  const badge = (document.getElementById('pf_badge').value || '').trim();

  if(!name || !category || !price || price<=0){
    showToast('Completa nombre, categoría y un precio válido');
    return;
  }

  const colors = colorsRaw ? colorsRaw.split(',').map(s=>s.trim()).filter(Boolean) : ['Único'];
  const img = productFormUi.imgData || genPlaceholderIcon(name);
  const overrides = loadProductOverrides();

  if(productFormUi.editingId){
    overrides.edits[productFormUi.editingId] = Object.assign(
      {}, overrides.edits[productFormUi.editingId],
      {name, category, price, short, desc: desc || short, colors, img, hero: img, badge: badge || undefined}
    );
    setStock(productFormUi.editingId, stock);
    persistProductOverrides();
    rebuildProducts();
    showToast('Producto actualizado');
    go('inventory');
  } else {
    const id = slugify(name) + '-' + Math.random().toString(36).slice(2,7);
    const newProduct = {
      id, name, category, price,
      short: short || name,
      desc: desc || short || name,
      rating: 4.5, reviews: 0,
      img, hero: img,
      features: [], specs: [['Categoría', categoryLabel(category)]], inbox: [`1x ${name}`],
      colors, perks: [],
      badge: badge || undefined,
    };
    overrides.added.push(newProduct);
    persistProductOverrides();
    rebuildProducts();
    setStock(id, stock);
    showToast('¡Producto creado!');
    go('inventory');
  }
}

/* ============ Panel de clientes y ventas (admin) ============ */
function computeSalesAnalytics(){
  const orders = loadOrders();
  const totalSales = orders.reduce((a,o)=>a+(o.total||0),0);
  const totalUnits = orders.reduce((a,o)=>a + (o.items||[]).reduce((s,it)=>s+it.qty,0), 0);
  const totalOrders = orders.length;
  const avgTicket = totalOrders ? totalSales/totalOrders : 0;

  const productMap = {}, categoryMap = {}, locationMap = {}, customerMap = {};

  orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      const p = byId(it.id);
      if(!p) return;
      const revenue = p.price * it.qty;
      if(!productMap[it.id]) productMap[it.id] = {id:it.id, name:p.name, img:p.img, qty:0, revenue:0};
      productMap[it.id].qty += it.qty;
      productMap[it.id].revenue += revenue;
      if(!categoryMap[p.category]) categoryMap[p.category] = {key:p.category, label:categoryLabel(p.category), qty:0, revenue:0};
      categoryMap[p.category].qty += it.qty;
      categoryMap[p.category].revenue += revenue;
    });

    const city = (o.address && o.address.ciudad) || 'Sin especificar';
    if(!locationMap[city]) locationMap[city] = {city, orders:0, revenue:0};
    locationMap[city].orders += 1;
    locationMap[city].revenue += (o.total||0);

    const email = (o.customer && o.customer.email) || ('sin-datos-'+o.id);
    if(!customerMap[email]) customerMap[email] = {
      name: (o.customer && o.customer.name) || 'Sin nombre',
      email: (o.customer && o.customer.email) || '—',
      phone: (o.customer && o.customer.phone) || '—',
      city: (o.address && o.address.ciudad) || '—',
      orders: 0, total: 0, status: o.status, lastDate: o.date
    };
    customerMap[email].orders += 1;
    customerMap[email].total += (o.total||0);
    /* nos quedamos con el estado del pedido mas reciente de este cliente */
    customerMap[email].status = o.status;
    customerMap[email].lastDate = o.date;
  });

  return {
    totalSales, totalUnits, totalOrders, avgTicket,
    topProducts: Object.keys(productMap).map(k=>productMap[k]).sort((a,b)=>b.qty-a.qty),
    topCategories: Object.keys(categoryMap).map(k=>categoryMap[k]).sort((a,b)=>b.revenue-a.revenue),
    topLocations: Object.keys(locationMap).map(k=>locationMap[k]).sort((a,b)=>b.revenue-a.revenue),
    customers: Object.keys(customerMap).map(k=>customerMap[k]).sort((a,b)=>b.total-a.total),
  };
}

function barRow(label, value, maxValue, valueLabel, imgSrc){
  const pct = maxValue>0 ? Math.max(4, Math.round(value/maxValue*100)) : 0;
  return `<div style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:10px;">
      <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#333;min-width:0;">
        ${imgSrc?`<img src="${imgSrc}" style="width:24px;height:24px;object-fit:cover;border-radius:5px;flex:none;">`:''}
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</span>
      </span>
      <b style="font-size:12.5px;white-space:nowrap;">${valueLabel}</b>
    </div>
    <div style="background:var(--cream);border-radius:6px;height:8px;overflow:hidden;">
      <div style="background:var(--gold);height:100%;width:${pct}%;border-radius:6px;"></div>
    </div>
  </div>`;
}

const productUi = { color:null, qty:1 };
const accountUi = { editing:false };
const reviewUi = { pid:null, rating:0 };

/* ============ Reseñas de producto (persistidas en localStorage) ============ */
const REVIEWS_KEY = 'todocompro_reviews_v1';
let reviewsCache = null;
function loadAllReviews(){
  if(reviewsCache) return reviewsCache;
  try{
    const raw = localStorage.getItem(REVIEWS_KEY);
    reviewsCache = raw ? JSON.parse(raw) : {};
  }catch(e){
    reviewsCache = {}; /* localStorage no disponible (ej. file:// en algunos navegadores) */
  }
  return reviewsCache;
}
function persistAllReviews(){
  try{ localStorage.setItem(REVIEWS_KEY, JSON.stringify(reviewsCache)); }
  catch(e){ /* si falla, la reseña queda solo en memoria durante esta sesión */ }
}
function getProductReviews(pid){
  const all = loadAllReviews();
  return all[pid] || [];
}
function addProductReview(pid, review){
  const all = loadAllReviews();
  if(!all[pid]) all[pid] = [];
  all[pid].unshift(review);
  persistAllReviews();
}

/* ============ Inventario (persistido en localStorage) ============ */
const INVENTORY_KEY = 'todocompro_inventory_v1';
let inventoryCache = null;
function loadInventoryOverrides(){
  if(inventoryCache) return inventoryCache;
  try{
    const raw = localStorage.getItem(INVENTORY_KEY);
    inventoryCache = raw ? JSON.parse(raw) : {};
  }catch(e){
    inventoryCache = {};
  }
  return inventoryCache;
}
function persistInventoryOverrides(){
  try{ localStorage.setItem(INVENTORY_KEY, JSON.stringify(inventoryCache)); }
  catch(e){ /* solo en memoria durante esta sesion si falla */ }
}
function getStock(pid){
  const overrides = loadInventoryOverrides();
  if(Object.prototype.hasOwnProperty.call(overrides, pid)) return overrides[pid];
  const p = byId(pid);
  return p ? (p.stock || 0) : 0;
}
function setStock(pid, value){
  const n = Math.max(0, parseInt(value, 10) || 0);
  const overrides = loadInventoryOverrides();
  overrides[pid] = n;
  persistInventoryOverrides();
  return n;
}
function stockStatus(qty){
  if(qty <= 0) return {label:'Agotado', color:'#b23b3b', bg:'#fbeaea'};
  if(qty <= 5) return {label:'Stock bajo', color:'#a86c1c', bg:'#fdf1de'};
  return {label:'En stock', color:'#1f8a4c', bg:'#eefbf1'};
}

/* ============ Pedidos (persistidos en localStorage) ============ */
const ORDERS_KEY = 'todocompro_orders_v1';
let ordersCache = null;
function loadOrders(){
  if(ordersCache) return ordersCache;
  try{
    const raw = localStorage.getItem(ORDERS_KEY);
    ordersCache = raw ? JSON.parse(raw) : [];
  }catch(e){
    ordersCache = [];
  }
  return ordersCache;
}
function persistOrders(){
  try{ localStorage.setItem(ORDERS_KEY, JSON.stringify(ordersCache)); }
  catch(e){ /* solo en memoria durante esta sesion si falla */ }
}
function addOrder(order){
  const orders = loadOrders();
  orders.push(order);
  persistOrders();
}
function updateOrder(id, patch){
  const orders = loadOrders();
  const o = orders.find(x=>x.id===id);
  if(o){ Object.assign(o, patch); persistOrders(); }
  return o;
}
const ORDER_STATUSES = {
  en_proceso: {label:'En proceso', color:'#a86c1c', bg:'#fdf1de'},
  enviado:    {label:'Enviado',    color:'#2c6b8f', bg:'#eaf0f5'},
  entregado:  {label:'Entregado',  color:'#1f8a4c', bg:'#eefbf1'},
};
function copyTrackingNumber(code){
  const finish = ()=>showToast('Número de guía copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(finish).catch(()=>fallbackCopy(code, finish));
  } else {
    fallbackCopy(code, finish);
  }
}
function fallbackCopy(text, cb){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb && cb();
  }catch(e){ showToast('No se pudo copiar — copiá manualmente: ' + text); }
}

function blendedRating(p){
  const userReviews = getProductReviews(p.id);
  const baseCount = p.reviews;
  const baseTotal = p.rating * p.reviews;
  const userTotal = userReviews.reduce((a,r)=>a+r.rating,0);
  const count = baseCount + userReviews.length;
  const avg = count>0 ? (baseTotal+userTotal)/count : 0;
  return {avg: Math.round(avg*10)/10, count};
}
function submitReview(pid){
  const nameInput = document.getElementById('review_name');
  const commentInput = document.getElementById('review_comment');
  const name = (nameInput.value || '').trim();
  const comment = (commentInput.value || '').trim();
  if(reviewUi.rating === 0){ showToast('Elegí una calificación en estrellas'); return; }
  if(!name || !comment){ showToast('Completa tu nombre y tu comentario'); return; }
  addProductReview(pid, {
    name, rating: reviewUi.rating, comment,
    date: new Date().toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'})
  });
  reviewUi.rating = 0;
  showToast('¡Gracias por tu reseña!');
  render();
}

        <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;">Tu comentario</label>
        <textarea id="review_comment" rows="3" placeholder="Contanos qué te pareció el producto..." style="width:100%;border:1px solid #ddd;border-radius:8px;padding:11px 12px;font-size:13.5px;outline:none;font-family:inherit;resize:vertical;"></textarea>
      </div>
      <button class="btn btn-gold" onclick="submitReview('${p.id}')">Publicar reseña</button>
    </div>
  </div>`;
}

function colorSwatch(c){
  const map = {Negro:'#1a1a1a',Blanco:'#f4f4f4',Plateado:'#c9c9c9',Acero:'#8b8b8b',Multicolor:'linear-gradient(90deg,#f00,#0f0,#00f)',Natural:'#c9a877',Gris:'#8f8f8f',Rojo:'#c0392b',Azul:'#2c5aa0'};
  return map[c] || '#ccc';
}

/* ============ Cart page ============ */
function renderCartPage(){
  const related = PRODUCTS.slice(0,5);
  return `<div class="page">
    <h1 style="font-size:26px;margin:0 0 6px;">Tu carrito</h1>
    <div style="font-size:13px;color:var(--muted);margin-bottom:22px;">
      <a href="#" onclick="go('home');return false;">Inicio</a> &nbsp;›&nbsp; Carrito de compras
    </div>
    ${state.cart.length===0 ? emptyCartHtml() : `
    <div class="cart-layout" style="display:flex;gap:26px;align-items:flex-start;">
      <div style="flex:1;min-width:0;">
        <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;">
          <div class="cart-row cart-table-head" style="padding:14px 20px;background:#faf8f3;font-size:12.5px;font-weight:700;color:#555;">
            <span>Producto</span><span>Precio</span><span>Cantidad</span><span>Subtotal</span><span></span>
          </div>
          ${state.cart.map((c,idx)=>{
            const p = byId(c.id);
            return `<div class="cart-row" style="padding:16px 20px;align-items:center;border-top:1px solid var(--border);">
              <div style="display:flex;gap:14px;align-items:center;">
                <img src="${p.img}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);">
                <div><div style="font-weight:600;font-size:14px;">${p.name}</div><div style="font-size:12.5px;color:var(--muted);">Color: ${c.color}</div></div>
              </div>
              <span style="font-size:14px;">${money(p.price)}</span>
              <div style="display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;width:fit-content;">
                <button onclick="changeQty(${idx},-1)" style="width:30px;height:30px;background:none;border:none;">−</button>
                <span style="width:28px;text-align:center;font-size:13.5px;">${c.qty}</span>
                <button onclick="changeQty(${idx},1)" style="width:30px;height:30px;background:none;border:none;">+</button>
              </div>
              <b style="font-size:14px;">${money(p.price*c.qty)}</b>
              <button onclick="removeFromCart(${idx})" style="background:none;border:none;color:#a99;">${ICONS.trash}</button>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:26px;margin-top:20px;flex-wrap:wrap;">
          <div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:#555;">${ICONS.truck}<div><b style="display:block;font-size:12.5px;">Envío rápido</b>Recíbelo entre 2 y 4 días hábiles</div></div>
          <div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:#555;">${ICONS.shield}<div><b style="display:block;font-size:12.5px;">Compra segura</b>Tus datos siempre protegidos</div></div>
          <div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:#555;">${ICONS.refresh}<div><b style="display:block;font-size:12.5px;">Devoluciones fáciles</b>Hasta 7 días después de recibir</div></div>
        </div>
      </div>
      <div style="flex:0 0 360px;border:1px solid var(--border);border-radius:10px;padding:22px;">
        <h3 style="margin:0 0 16px;font-size:18px;">Resumen del pedido</h3>
        <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;"><span>Subtotal (${cartCount()} producto${cartCount()!==1?'s':''})</span><b>${money(cartTotal())}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:16px;color:var(--muted);"><span>Envío</span><span style="color:var(--green);font-weight:600;">Gratis</span></div>
        <div style="border-top:1px solid var(--border);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
          <b style="font-size:16px;">Total</b><b style="font-size:22px;">${money(cartTotal())}</b>
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:18px;">IVA incluido</div>
        <button class="btn btn-gold btn-block" onclick="go('checkout',{step:2})">${ICONS.lock} Finalizar compra</button>
        <div style="margin-top:20px;">
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Tu información está protegida</div>
          <div style="display:flex;gap:8px;align-items:center;font-size:11px;color:#888;">${ICONS.shield} Usamos tecnología cifrada para proteger tus datos y transacciones.</div>
        </div>
      </div>
    </div>
    <div style="margin-top:40px;">
      <h2 style="font-size:20px;margin:0 0 16px;">Productos que te pueden interesar</h2>
      <div class="flexgrid" style="--n:5;">
        ${related.filter(p=>!state.cart.find(c=>c.id===p.id)).map(productCardHtml).join('')}
      </div>
    </div>`}
  </div>`;
}

function emptyCartHtml(){
  return `<div style="text-align:center;padding:70px 20px;border:1px dashed var(--border);border-radius:12px;">
    <div style="font-size:44px;margin-bottom:14px;">🛒</div>
    <h3 style="margin:0 0 8px;">Tu carrito está vacío</h3>
    <p style="color:var(--muted);font-size:14px;margin:0 0 22px;">Explora nuestros productos destacados y encuentra algo que te encante.</p>
    <button class="btn btn-gold" onclick="go('home')">Ir a la tienda</button>
  </div>`;
}

/* ============ Checkout flow ============ */
function orderSummaryHtml(showBadge){
  return `<div style="border:1px solid var(--border);border-radius:10px;padding:22px;">
    <h3 style="margin:0 0 16px;font-size:18px;">Resumen del pedido</h3>
    ${cartItemsHtml(false)}
    <div style="display:flex;justify-content:space-between;font-size:14px;margin:16px 0 8px;"><span>Subtotal (${cartCount()} producto${cartCount()!==1?'s':''})</span><b>${money(cartTotal())}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px;color:var(--muted);"><span>Envío</span><span style="color:var(--green);font-weight:600;">${state.shipping==='express'?money(9900):'Gratis'}</span></div>
    <div style="border-top:1px solid var(--border);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;">
      <b style="font-size:16px;">Total a pagar</b><b style="font-size:22px;">${money(cartTotal() + (state.shipping==='express'?9900:0))}</b>
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">IVA incluido</div>
    ${showBadge?`<div style="background:#eefbf1;border:1px solid #cdeed8;border-radius:8px;padding:12px 14px;margin-top:16px;display:flex;gap:10px;align-items:center;font-size:12.5px;color:#1f5c34;">${ICONS.shield}<span><b>Compra 100% segura</b><br>Tus datos están protegidos y tu pago es seguro.</span></div>`:''}
  </div>`;
}

function renderCheckout(){
  if(state.cart.length===0 && state.checkoutStep<4){
    return `<div class="page">${emptyCartHtml()}</div>`;
  }
  let body;
  if(state.checkoutStep===2) body = renderCheckoutInfo();
  else if(state.checkoutStep===3) body = renderCheckoutRedirect();
  else if(state.checkoutStep===4) body = renderCheckoutPayment();
  else body = renderCheckoutInfo();
  return `<div class="page" style="max-width:1200px;">
    ${stepsHtml(state.checkoutStep)}
    ${body}
  </div>`;
}

function captureCheckoutInfo(){
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  state.contact = {
    name: val('contact_name'),
    email: val('contact_email'),
    phone: val('contact_phone'),
  };
  state.address = {
    depto: val('addr_depto'),
    ciudad: val('addr_ciudad'),
    full: val('addr_full'),
    ref: val('addr_ref'),
  };
}

function renderCheckoutInfo(){
  return `<h1 style="font-size:24px;margin:0 0 4px;">Finalizar compra</h1>
  <p style="color:var(--muted);font-size:14px;margin:0 0 24px;">Completa la información para procesar tu pedido</p>
  <div class="checkout-layout" style="display:flex;gap:26px;align-items:flex-start;">
    <div style="display:flex;flex-direction:column;gap:18px;flex:1;min-width:0;">
      <div style="border:1px solid var(--border);border-radius:10px;padding:22px;">
        <h3 style="margin:0 0 16px;font-size:16px;">1. Información de contacto</h3>
        <div class="flexgrid" style="--n:3;">
          ${inputField('Nombre completo','Ej: Juan Pérez','contact_name')}
          ${inputField('Correo electrónico','Ej: juanperez@gmail.com','contact_email')}
          ${inputField('Teléfono / WhatsApp','Ej: 300 123 4567','contact_phone')}
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin-top:14px;">
          <input type="checkbox" checked> Quiero recibir ofertas y novedades por correo o WhatsApp
        </label>
      </div>
      <div style="border:1px solid var(--border);border-radius:10px;padding:22px;">
        <h3 style="margin:0 0 16px;font-size:16px;">2. Dirección de envío</h3>
        <div class="flexgrid" style="--n:2;margin-bottom:14px;">
          ${selectField('Departamento',['Antioquia','Cundinamarca','Quindío','Valle del Cauca'],'addr_depto')}
          ${selectField('Ciudad',['Medellín','Bogotá','Armenia','Cali'],'addr_ciudad')}
        </div>
        <div class="flexgrid" style="--n:2;">
          ${inputField('Dirección completa','Ej: Calle 123 # 45-67, Apartamento 101','addr_full')}
          ${inputField('Barrio / Referencia (opcional)','Ej: Frente al parque principal','addr_ref')}
        </div>
      </div>
      <div style="border:1px solid var(--border);border-radius:10px;padding:22px;">
        <h3 style="margin:0 0 16px;font-size:16px;">3. Método de envío</h3>
        ${shippingOption('standard','Envío estándar','Recíbelo entre 2 y 4 días hábiles','Gratis')}
        ${shippingOption('express','Envío express','Recíbelo entre 24 y 48 horas hábiles', money(9900))}
      </div>
    </div>
    <div style="flex:0 0 380px;">
      ${orderSummaryHtml(true)}
      <div style="margin-top:16px;">
        <button class="btn btn-gold btn-block" onclick="captureCheckoutInfo();go('checkout',{step:3})">${ICONS.lock} Confirmar pedido y continuar al pago</button>
        <p style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:12px;">Al continuar, aceptas nuestros <a href="#" style="color:var(--gold-dark);" onclick="return false;">Términos y Condiciones</a> y la <a href="#" style="color:var(--gold-dark);" onclick="return false;">Política de Privacidad</a>.</p>
      </div>
    </div>
  </div>`;
}

function inputField(label, placeholder, id){
  return `<div><label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;">${label} <span style="color:var(--gold-dark);">*</span></label>
    <input id="${id}" type="text" placeholder="${placeholder}" style="width:100%;border:1px solid #ddd;border-radius:8px;padding:11px 12px;font-size:13.5px;outline:none;" onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='#ddd'"></div>`;
}
function selectField(label, options, id){
  return `<div><label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;">${label} <span style="color:var(--gold-dark);">*</span></label>
    <select id="${id||''}" style="width:100%;border:1px solid #ddd;border-radius:8px;padding:11px 12px;font-size:13.5px;outline:none;background:#fff;">
      <option>Selecciona</option>${options.map(o=>`<option>${o}</option>`).join('')}
    </select></div>`;
}
function shippingOption(value,title,desc,price){
  const active = state.shipping===value;
  return `<label style="display:flex;align-items:center;gap:14px;border:1px solid ${active?'var(--gold)':'var(--border)'};background:${active?'#fdf8ee':'#fff'};border-radius:10px;padding:16px;margin-bottom:12px;cursor:pointer;">
    <input type="radio" name="shipping" ${active?'checked':''} onchange="state.shipping='${value}';render();">
    ${ICONS.truck}
    <div style="flex:1;"><b style="font-size:14px;">${title}</b><div style="font-size:12.5px;color:var(--muted);">${desc}</div></div>
    <b style="color:${price==='Gratis'?'var(--green)':'#222'};font-size:14px;">${price}</b>
  </label>`;
}

function renderCheckoutRedirect(){
  setTimeout(()=>{ if(state.view==='checkout' && state.checkoutStep===3) go('checkout',{step:4}); }, 1800);
  return `<div style="max-width:640px;margin:0 auto;text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:#fdf1de;display:flex;align-items:center;justify-content:center;margin:10px auto 20px;color:var(--gold-dark);">${ICONS.lock}</div>
    <h2 style="margin:0 0 8px;">Redirigiendo al pago seguro</h2>
    <p style="color:var(--muted);font-size:14.5px;margin:0 0 26px;">Estás a punto de completar tu compra de forma segura.</p>
    <div style="text-align:left;">${orderSummaryHtml(false)}</div>
    <div style="display:flex;gap:10px;align-items:center;justify-content:center;color:#1f5c34;background:#eefbf1;border:1px solid #cdeed8;border-radius:8px;padding:12px;margin:20px 0;font-size:13px;">${ICONS.shield} Compra 100% segura — Tus datos están protegidos y tu pago es seguro.</div>
    <div style="background:#eef2fb;border:1px solid #d7e0f5;border-radius:8px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center;">
      <span style="color:#2554c7;">⏱</span>
      <div><b style="font-size:13.5px;">Redirigiendo a Mercado Pago...</b><br><span style="font-size:12px;color:var(--muted);">No cierres esta ventana ni actualices la página.</span></div>
    </div>
    <div style="height:6px;background:#e7e2d5;border-radius:4px;margin-top:16px;overflow:hidden;">
      <div style="height:100%;width:60%;background:var(--gold);border-radius:4px;animation:loadbar 1.8s ease forwards;"></div>
    </div>
    <style>@keyframes loadbar{from{width:0%}to{width:100%}}</style>
    <button class="btn btn-outline" style="margin-top:22px;" onclick="go('checkout',{step:4})">Ir al pago ahora</button>
  </div>`;
}

function renderCheckoutPayment(){
  return `<h2 style="font-size:22px;margin:0 0 4px;">Elige tu método de pago</h2>
  <p style="color:var(--muted);font-size:14px;margin:0 0 20px;">Todos los pagos son 100% seguros y encriptados.</p>
  <div class="checkout-layout" style="display:flex;gap:26px;align-items:flex-start;">
    <div style="flex:1;min-width:0;">
      <div style="display:flex;gap:10px;align-items:center;background:#eefbf1;border:1px solid #cdeed8;border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#1f5c34;">${ICONS.shield}<span><b>Tu pago está protegido</b><br>Usamos tecnología SSL y pasarelas certificadas.</span></div>
      ${paymentOption('mercadopago','Mercado Pago','Paga con tu saldo, tarjeta de crédito, débito o PSE.', true)}
      ${paymentOption('tarjeta','Tarjeta de crédito / débito','Visa, Mastercard, American Express y más.')}
      ${paymentOption('pse','PSE','Paga desde tu banco.')}
      ${paymentOption('contraentrega','Pago contra entrega','Paga cuando recibas tu pedido en la puerta de tu casa.')}
      <a href="#" onclick="go('checkout',{step:2});return false;" style="display:inline-flex;align-items:center;gap:6px;color:var(--gold-dark);font-size:13.5px;font-weight:600;margin-top:6px;">${ICONS.chevronL} Volver a información de envío</a>
    </div>
    <div style="flex:0 0 380px;">
      ${orderSummaryHtml(true)}
      <button class="btn btn-gold btn-block" style="margin-top:16px;" onclick="completeOrder()">${ICONS.lock} Confirmar y pagar</button>
    </div>
  </div>`;
}

function paymentOption(value,title,desc,highlight){
  const active = state.payment===value;
  return `<label style="display:block;border:1px solid ${active?'var(--gold)':'var(--border)'};background:${active?'#fdf8ee':'#fff'};border-radius:10px;padding:16px;margin-bottom:12px;cursor:pointer;">
    <div style="display:flex;align-items:center;gap:14px;">
      <input type="radio" name="payment" ${active?'checked':''} onchange="state.payment='${value}';render();">
      <div style="flex:1;"><b style="font-size:14px;">${title}</b><div style="font-size:12.5px;color:var(--muted);">${desc}</div></div>
    </div>
    ${active && highlight ? `<div style="margin-top:14px;background:#fdf3df;border-radius:8px;padding:14px;">
      <b style="font-size:13px;">Pagar con Mercado Pago</b>
      <p style="font-size:12.5px;color:#6b5f4a;margin:4px 0 10px;">Serás redirigido a Mercado Pago para completar tu pago de forma segura.</p>
      <button class="btn btn-gold" style="font-size:13px;padding:10px 16px;" onclick="event.preventDefault();completeOrder()">Continuar con Mercado Pago</button>
    </div>`:''}
  </label>`;
}

function completeOrder(){
  const app = document.getElementById('app');
  const orderNum = 'TC-' + Math.floor(100000 + Math.random()*899999);
  const total = cartTotal() + (state.shipping==='express'?9900:0);
  addOrder({
    id: orderNum,
    total: total,
    itemsCount: cartCount(),
    items: state.cart.map(c=>({id:c.id, qty:c.qty, color:c.color})),
    date: new Date().toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}),
    status: 'en_proceso',
    tracking: '',
    customer: Object.assign({}, state.contact),
    address: Object.assign({}, state.address),
  });
  app.innerHTML = headerHtml({simple:true}) + `
  <div class="page" style="max-width:640px;text-align:center;padding-top:60px;">
    <div style="width:78px;height:78px;border-radius:50%;background:#eefbf1;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;color:#1f8a4c;font-size:34px;">${ICONS.check}</div>
    <h1 style="font-size:26px;margin:0 0 10px;">¡Gracias por tu compra!</h1>
    <p style="color:var(--muted);font-size:14.5px;margin:0 0 26px;">Tu pedido <b>${orderNum}</b> fue confirmado. Te enviaremos un correo con los detalles de seguimiento.</p>
    <div style="border:1px solid var(--border);border-radius:10px;padding:22px;text-align:left;">
      ${cartItemsHtml(false)}
      <div style="border-top:1px solid var(--border);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;">
        <b style="font-size:16px;">Total pagado</b><b style="font-size:22px;">${money(total)}</b>
      </div>
    </div>
    <button class="btn btn-gold" style="margin-top:26px;" onclick="state.cart=[];go('home')">Volver a la tienda</button>
  </div>` + trustFootHtml();
  state.cart = [];
  window.scrollTo({top:0});
}

/* ============ Init ============ */
applyHash();

</script>
</body>
</html>
