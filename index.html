<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo Compro</title>
<style>
  :root{
    --gold:#D4A23F;
    --gold-dark:#C68021;
    --gold-darker:#a86c1c;
    --dark:#151616;
    --dark-2:#1f2020;
    --cream:#FDF9F2;
    --text:#1c1d1e;
    --muted:#767268;
    --border:#e8e3d6;
    --green:#3a9d5d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:#fff;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ul{list-style:none;margin:0;padding:0;}
  img{max-width:100%;display:block;}
  svg{width:18px;height:18px;vertical-align:middle;flex-shrink:0;stroke:currentColor;fill:none;}

  /* ---------- Topbar ---------- */
  .topbar{
    background:var(--cream);
    border-bottom:1px solid var(--border);
    font-size:13px;
    color:#54504a;
  }
  .topbar-inner{
    max-width:1400px;margin:0 auto;
    display:flex;justify-content:space-between;
    padding:9px 32px;
    gap:16px;
  }
  .topbar-inner span{display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .topbar-inner svg{width:15px;height:15px;flex:none;}

  /* ---------- Header ---------- */
  header.main{
    background:#fff;
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1400px;margin:0 auto;
    display:flex;align-items:center;gap:28px;
    padding:16px 32px;
  }
  .logo-link{display:flex;align-items:center;flex:none;}
  .logo-link img{height:42px;width:auto;}
  .search-wrap{
    flex:1;display:flex;max-width:640px;
  }
  .search-wrap input{
    flex:1;border:1px solid #ddd;border-right:none;
    border-radius:8px 0 0 8px;
    padding:11px 16px;font-size:14px;outline:none;background:#fafafa;
  }
  .search-wrap input:focus{border-color:var(--gold);background:#fff;}
  .search-btn{
    background:var(--gold);border:none;border-radius:0 8px 8px 0;
    width:50px;display:flex;align-items:center;justify-content:center;
  }
  .search-btn svg{width:19px;height:19px;stroke:#fff;}
  .header-actions{display:flex;align-items:center;gap:26px;margin-left:auto;flex:none;}
  .header-action{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:#333;position:relative;}
  .header-action svg{width:22px;height:22px;stroke:#222;fill:none;}
  .cart-count{
    position:absolute;top:-8px;right:-10px;
    background:var(--gold);color:#fff;font-size:10.5px;font-weight:700;
    border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Category nav ---------- */
  .catnav{
    max-width:1400px;margin:0 auto;
    display:flex;align-items:center;gap:30px;
    padding:13px 32px;font-size:14.5px;font-weight:500;color:#2c2c2c;
    overflow-x:auto;
  }
  .catnav .catall{
    display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;
  }
  .catnav a{display:flex;align-items:center;gap:7px;white-space:nowrap;color:#333;}
  .catnav a.active{color:var(--gold-dark);}
  .catnav svg{width:16px;height:16px;stroke:currentColor;fill:none;flex:none;}

  /* ---------- Layout wrapper ---------- */
  .page{max-width:1400px;margin:0 auto;padding:28px 32px 60px;}

  /* ---------- Footer strip ---------- */
  .trustfoot{
    background:var(--cream);border-top:1px solid var(--border);
    margin-top:40px;
  }
  .trustfoot-inner{
    max-width:1400px;margin:0 auto;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;
    padding:26px 32px;
  }
  .trustfoot-item{display:flex;align-items:center;gap:12px;font-size:13.5px;}
  .trustfoot-item svg{width:26px;height:26px;stroke:var(--gold-dark);fill:none;flex:none;}
  .trustfoot-item b{display:block;font-size:13.5px;color:#222;}
  .trustfoot-item span{color:var(--muted);font-size:12.5px;}

  .sitefoot{
    background:var(--dark);color:#cfcac0;font-size:12.5px;
    padding:16px 32px;display:flex;justify-content:space-between;
  }
  .sitefoot a{color:#cfcac0;margin-left:18px;}

  /* generic small star row */
  .stars{color:var(--gold);font-size:13px;letter-spacing:1px;}
  .stars .cnt{color:var(--muted);font-size:12px;margin-left:4px;letter-spacing:0;}

  /* button styles */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:8px;font-weight:700;font-size:14.5px;
    border:1px solid transparent;transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(0.95);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-outline{background:#fff;color:var(--gold-dark);border-color:var(--gold);}
  .btn-dark{background:var(--dark);color:#fff;}
  .btn-block{width:100%;}

  /* toast */
  .toast{
    position:fixed;top:18px;right:18px;background:#1f8a4c;color:#fff;
    padding:14px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);
    z-index:999;opacity:0;transform:translateY(-10px);transition:all .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  /* cart drawer */
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(20,18,14,.35);z-index:900;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .drawer-overlay.show{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:420px;max-width:92vw;
    background:#fff;z-index:901;box-shadow:-10px 0 30px rgba(0,0,0,.15);
    transform:translateX(100%);transition:transform .3s ease;
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--border);}
  .drawer-head h3{margin:0;font-size:20px;}
  .drawer-body{padding:20px 24px;overflow-y:auto;flex:1;}
  .drawer-foot{padding:20px 24px;border-top:1px solid var(--border);}

  /* flex-based grid replacement (n equal columns, wraps, gap via margin for old engines) */
  .flexgrid{
    display:flex;flex-wrap:wrap;gap:16px;
  }
  .flexgrid > *{
    flex:1 1 calc((100% / var(--n)) - 16px);
    min-width:160px;
  }
  .cart-row{
    display:flex;align-items:center;gap:12px;
  }
  .cart-row > *:nth-child(1){flex:2 1 0;min-width:0;}
  .cart-row > *:nth-child(2){flex:1 1 0;}
  .cart-row > *:nth-child(3){flex:1 1 0;}
  .cart-row > *:nth-child(4){flex:1 1 0;}
  .cart-row > *:nth-child(5){flex:0 0 auto;}

  @media (max-width:900px){
    .flexgrid > *{flex:1 1 100%;}
    .cart-row{flex-wrap:wrap;}
    .header-inner{flex-wrap:wrap;}
    .search-wrap{order:3;max-width:100%;width:100%;}
    .catnav{gap:16px;}
    .page{padding:20px 16px 40px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="cartDrawer"></div>
<div class="toast" id="toast"></div>

function byId(id){ return PRODUCTS.find(p=>p.id===id); }
function categoryLabel(key){ const c = CATEGORIES.find(x=>x.key===key); return c ? c.label : key; }
function money(n){
  const s = Math.round(n).toString();
  const withDots = s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return '$' + withDots;
}
function starRow(rating){
  const full = Math.round(rating);
  let s='';
  for(let i=0;i<5;i++){ s += i<full ? '★' : '☆'; }
  return s;
}

/* ============ State ============ */
const state = {
  view: 'home',           // home | product | cart | checkout
  productId: 'aspiradora',
  cart: [],                // {id, qty, color}
  checkoutStep: 1,         // 1 cart,2 info,3 shipping-redirect,4 payment
  contact: {},
  address: {},
  shipping: 'standard',
  payment: 'mercadopago',
};

function cartCount(){ return state.cart.reduce((a,c)=>a+c.qty,0); }
function cartTotal(){ return state.cart.reduce((a,c)=>a + byId(c.id).price*c.qty, 0); }

function addToCart(id, qty, color){
  const existing = state.cart.find(c=>c.id===id && c.color===color);
  if(existing){ existing.qty += qty; }
  else{ state.cart.push({id, qty, color}); }
  openDrawer(id);
  updateHeaderCounts();
}
function removeFromCart(idx){
  state.cart.splice(idx,1);
  render();
}
function changeQty(idx, delta){
  state.cart[idx].qty = Math.max(1, state.cart[idx].qty + delta);
  render();
}

function go(view, opts){
  state.view = view;
  if(opts && opts.productId) state.productId = opts.productId;
  if(opts && opts.step) state.checkoutStep = opts.step;
  window.scrollTo({top:0, behavior:'instant'});
  render();
}

/* ============ Toast ============ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

  const overlay = document.getElementById('drawerOverlay');

  if(state.cart.length===0) return `<p style="color:var(--muted);font-size:14px;">Tu carrito está vacío.</p>`;

    return `<div style="display:flex;gap:12px;padding:${compact?'0 0 16px':'16px 0'};${compact?'':'border-bottom:1px solid var(--border);'}">

        <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">${c.color}</div>

    </div>`;
  }).join('');
}

    <div style="aspect-ratio:1/1;overflow:hidden;background:#f7f5f0;">
      <img src="${p.img}" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div style="padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1;">
      <span style="font-size:13.5px;font-weight:500;color:#222;line-height:1.3;">${p.name}</span>
      <span style="font-size:16px;font-weight:700;">${money(p.price)}</span>
      <span class="stars">${starRow(p.rating)}<span class="cnt">(${p.reviews})</span></span>
    </div>
  </a>`;
}

/* ============ Render dispatcher ============ */
function render(){
  const app = document.getElementById('app');
  if(state.view==='home') app.innerHTML = headerHtml() + renderHome() + trustFootHtml();
  else if(state.view==='product') app.innerHTML = headerHtml() + renderProduct(byId(state.productId)) + trustFootHtml();
  else if(state.view==='cart') app.innerHTML = headerHtml() + renderCartPage() + trustFootHtml();
  else if(state.view==='checkout') app.innerHTML = headerHtml({simple:true}) + renderCheckout() + trustFootHtml();
  updateHeaderCounts();
  window.scrollTo({top:0});
}

function colorSwatch(c){
  const map = {Negro:'#1a1a1a',Blanco:'#f4f4f4',Plateado:'#c9c9c9',Acero:'#8b8b8b',Multicolor:'linear-gradient(90deg,#f00,#0f0,#00f)',Natural:'#c9a877'};
  return map[c] || '#ccc';
}

  </div>`;
}

function renderCheckout(){
  if(state.cart.length===0 && state.checkoutStep<4){
    return `<div class="page">${emptyCartHtml()}</div>`;
  }
  let body;
  if(state.checkoutStep===2) body = renderCheckoutInfo();
  else if(state.checkoutStep===3) body = renderCheckoutRedirect();
  else if(state.checkoutStep===4) body = renderCheckoutPayment();
  else body = renderCheckoutInfo();
  return `<div class="page" style="max-width:1200px;">
    ${stepsHtml(state.checkoutStep)}
    ${body}
  </div>`;
}

}
function selectField(label, options){
  return `<div><label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:6px;">${label} <span style="color:var(--gold-dark);">*</span></label>
    <select style="width:100%;border:1px solid #ddd;border-radius:8px;padding:11px 12px;font-size:13.5px;outline:none;background:#fff;">
      <option>Selecciona</option>${options.map(o=>`<option>${o}</option>`).join('')}
    </select></div>`;
}
function shippingOption(value,title,desc,price){
  const active = state.shipping===value;
  return `<label style="display:flex;align-items:center;gap:14px;border:1px solid ${active?'var(--gold)':'var(--border)'};background:${active?'#fdf8ee':'#fff'};border-radius:10px;padding:16px;margin-bottom:12px;cursor:pointer;">
    <input type="radio" name="shipping" ${active?'checked':''} onchange="state.shipping='${value}';render();">
    ${ICONS.truck}
    <div style="flex:1;"><b style="font-size:14px;">${title}</b><div style="font-size:12.5px;color:var(--muted);">${desc}</div></div>
    <b style="color:${price==='Gratis'?'var(--green)':'#222'};font-size:14px;">${price}</b>
  </label>`;
}

function renderCheckoutRedirect(){
  setTimeout(()=>{ if(state.view==='checkout' && state.checkoutStep===3) go('checkout',{step:4}); }, 1800);
  return `<div style="max-width:640px;margin:0 auto;text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:#fdf1de;display:flex;align-items:center;justify-content:center;margin:10px auto 20px;color:var(--gold-dark);">${ICONS.lock}</div>
    <h2 style="margin:0 0 8px;">Redirigiendo al pago seguro</h2>
    <p style="color:var(--muted);font-size:14.5px;margin:0 0 26px;">Estás a punto de completar tu compra de forma segura.</p>
    <div style="text-align:left;">${orderSummaryHtml(false)}</div>
    <div style="display:flex;gap:10px;align-items:center;justify-content:center;color:#1f5c34;background:#eefbf1;border:1px solid #cdeed8;border-radius:8px;padding:12px;margin:20px 0;font-size:13px;">${ICONS.shield} Compra 100% segura — Tus datos están protegidos y tu pago es seguro.</div>
    <div style="background:#eef2fb;border:1px solid #d7e0f5;border-radius:8px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center;">
      <span style="color:#2554c7;">⏱</span>
      <div><b style="font-size:13.5px;">Redirigiendo a Mercado Pago...</b><br><span style="font-size:12px;color:var(--muted);">No cierres esta ventana ni actualices la página.</span></div>
    </div>
    <div style="height:6px;background:#e7e2d5;border-radius:4px;margin-top:16px;overflow:hidden;">
      <div style="height:100%;width:60%;background:var(--gold);border-radius:4px;animation:loadbar 1.8s ease forwards;"></div>
    </div>
    <style>@keyframes loadbar{from{width:0%}to{width:100%}}</style>
    <button class="btn btn-outline" style="margin-top:22px;" onclick="go('checkout',{step:4})">Ir al pago ahora</button>
  </div>`;
}

function renderCheckoutPayment(){
  return `<h2 style="font-size:22px;margin:0 0 4px;">Elige tu método de pago</h2>
  <p style="color:var(--muted);font-size:14px;margin:0 0 20px;">Todos los pagos son 100% seguros y encriptados.</p>
  <div style="display:flex;gap:26px;align-items:flex-start;">
    <div style="flex:1;min-width:0;">
      <div style="display:flex;gap:10px;align-items:center;background:#eefbf1;border:1px solid #cdeed8;border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#1f5c34;">${ICONS.shield}<span><b>Tu pago está protegido</b><br>Usamos tecnología SSL y pasarelas certificadas.</span></div>
      ${paymentOption('mercadopago','Mercado Pago','Paga con tu saldo, tarjeta de crédito, débito o PSE.', true)}
      ${paymentOption('tarjeta','Tarjeta de crédito / débito','Visa, Mastercard, American Express y más.')}
      ${paymentOption('pse','PSE','Paga desde tu banco.')}
      ${paymentOption('contraentrega','Pago contra entrega','Paga cuando recibas tu pedido en la puerta de tu casa.')}
      <a href="#" onclick="go('checkout',{step:2});return false;" style="display:inline-flex;align-items:center;gap:6px;color:var(--gold-dark);font-size:13.5px;font-weight:600;margin-top:6px;">${ICONS.chevronL} Volver a información de envío</a>
    </div>
    <div style="flex:0 0 380px;">
      ${orderSummaryHtml(true)}
      <button class="btn btn-gold btn-block" style="margin-top:16px;" onclick="completeOrder()">${ICONS.lock} Confirmar y pagar</button>
    </div>
  </div>`;
}

function paymentOption(value,title,desc,highlight){
  const active = state.payment===value;
  return `<label style="display:block;border:1px solid ${active?'var(--gold)':'var(--border)'};background:${active?'#fdf8ee':'#fff'};border-radius:10px;padding:16px;margin-bottom:12px;cursor:pointer;">
    <div style="display:flex;align-items:center;gap:14px;">
      <input type="radio" name="payment" ${active?'checked':''} onchange="state.payment='${value}';render();">
      <div style="flex:1;"><b style="font-size:14px;">${title}</b><div style="font-size:12.5px;color:var(--muted);">${desc}</div></div>
    </div>
    ${active && highlight ? `<div style="margin-top:14px;background:#fdf3df;border-radius:8px;padding:14px;">
      <b style="font-size:13px;">Pagar con Mercado Pago</b>
      <p style="font-size:12.5px;color:#6b5f4a;margin:4px 0 10px;">Serás redirigido a Mercado Pago para completar tu pago de forma segura.</p>
      <button class="btn btn-gold" style="font-size:13px;padding:10px 16px;" onclick="event.preventDefault();completeOrder()">Continuar con Mercado Pago</button>
    </div>`:''}
  </label>`;
}

function completeOrder(){
  const app = document.getElementById('app');
  const orderNum = 'TC-' + Math.floor(100000 + Math.random()*899999);
  const total = cartTotal() + (state.shipping==='express'?9900:0);
  app.innerHTML = headerHtml({simple:true}) + `
  <div class="page" style="max-width:640px;text-align:center;padding-top:60px;">
    <div style="width:78px;height:78px;border-radius:50%;background:#eefbf1;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;color:#1f8a4c;font-size:34px;">${ICONS.check}</div>
    <h1 style="font-size:26px;margin:0 0 10px;">¡Gracias por tu compra!</h1>
    <p style="color:var(--muted);font-size:14.5px;margin:0 0 26px;">Tu pedido <b>${orderNum}</b> fue confirmado. Te enviaremos un correo con los detalles de seguimiento.</p>
    <div style="border:1px solid var(--border);border-radius:10px;padding:22px;text-align:left;">
      ${cartItemsHtml(false)}
      <div style="border-top:1px solid var(--border);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;">
        <b style="font-size:16px;">Total pagado</b><b style="font-size:22px;">${money(total)}</b>
      </div>
    </div>
    <button class="btn btn-gold" style="margin-top:26px;" onclick="state.cart=[];go('home')">Volver a la tienda</button>
  </div>` + trustFootHtml();
  state.cart = [];
  window.scrollTo({top:0});
}

/* ============ Init ============ */
render();

</script>
</body>
</html>
